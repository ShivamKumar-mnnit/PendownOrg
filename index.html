<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Anobyt — 1:1 mock interviews and mentorship for college students, in partnership with NIT Allahabad." />
    <title>Anobyt | Mock Interviews & Mentorship</title>
    <script>
      // Applied before React mounts so the page never flashes the wrong
      // theme on load. Kept in sync with src/lib/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem("algomate_theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
