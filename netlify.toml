[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Evaluated top-to-bottom, first match wins — so this has to come before
# the SPA catch-all below, or /api/compile would resolve to index.html
# instead of reaching the function.
[[redirects]]
  from = "/api/compile"
  to = "/.netlify/functions/compile"
  status = 200

# Note: the interactive (line-by-line) execution backend is NOT proxied
# through a redirect here — Netlify's redirect/proxy feature doesn't forward
# the WebSocket upgrade handshake correctly to an external origin. The
# frontend connects straight to wss://api.anobyt.in/ws/execute instead (see
# src/lib/interactiveCompiler.js).

# Client-side routing (React Router). Public pages are pre-built as real files by
# scripts/prerender.mjs (dist/<path>/index.html, served before this rule); every other route
# (dashboards, problems, tests …) gets app.html, the same app without a home-page canonical.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
