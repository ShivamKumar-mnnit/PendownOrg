[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Evaluated top-to-bottom, first match wins — so this has to come before
# the SPA catch-all below, or /api/compile would resolve to index.html
# instead of reaching the function.
[[redirects]]
  from = "/api/compile"
  to = "/.netlify/functions/compile"
  status = 200

# Note: the interactive (line-by-line) execution backend is NOT proxied
# through a redirect here — Netlify's redirect/proxy feature doesn't forward
# the WebSocket upgrade handshake correctly to an external origin. The
# frontend connects straight to wss://api.anobyt.in/ws/execute instead (see
# src/lib/interactiveCompiler.js).

# Common guesses for the sitemap address. Without these they fall through to the app's HTML,
# which Search Console reports as "Sitemap is HTML".
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301

# The TCS CodeVita Crash Course lives inside Courses at /courses/tcs-codevita.
# Earlier /codevita links (and their sub-pages) move there permanently.
[[redirects]]
  from = "/codevita"
  to = "/courses/tcs-codevita"
  status = 301
  force = true

[[redirects]]
  from = "/codevita/*"
  to = "/courses/tcs-codevita/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/courses/tcs-codevita-crash-course"
  to = "/courses/tcs-codevita"
  status = 301
  force = true

# Client-side routing (React Router). Public pages are pre-built as real files by
# scripts/prerender.mjs (dist/<path>.html, served before this rule); every other route
# (dashboards, problems, tests …) gets app.html, the same app without a home-page canonical.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
